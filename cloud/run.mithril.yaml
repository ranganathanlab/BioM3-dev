# BioM3 on Mithril — generic job runner
#
# Run BioM3 commands on Mithril. A specific command is passed through the CMD
# string, using biom3's own CLI args when appropriate.
#
# Launch:
#   scripts/cloud/mithril_launch.sh cloud/run.mithril.yaml biom3-run \
#     --env CMD="pytest tests/"
#
# Examples (anything the image can run):
#   --env CMD="biom3_ProteoScribe_sample -i data/x.pt -o outputs/y.pt"
#   --env CMD="biom3_train_stage3 --config_path configs/stage3_training/pretrain_scratch_v1.json --epochs 1"
#   --env CMD="nvidia-smi"           # sanity check
#
# Everything a job writes belongs under /app/outputs in the container, which is
# ~/biom3/outputs on each node. The cluster is torn down when CMD ends, so
# copying results elsewhere is part of CMD; see cloud/README.md.

resources:
  infra: mithril
  accelerators: A100:1        # PER-NODE GPUs

num_nodes: 1                  # >1 for multi-node (SkyPilot sets the rank env we forward)

config:
  mithril:
    limit_price: 1.00

envs:
  # ── The job: any command the image can run ────────────────────────────────
  CMD: null                  # REQUIRED — supply via --env CMD="..."

  IMAGE: ghcr.io/natural-machine/biom3:cuda-dev
  # A published weight set, pulled into /app/weights before CMD (e.g. run1_base).
  BIOM3_WEIGHTS_BUNDLE: ""
  WANDB_API_KEY: ""
  # Names of the variables passed into the container. Add any your CMD needs,
  # such as credentials for your own upload, and supply their values with --env
  # (or as secrets, below).
  FORWARD_ENV: "WANDB_API_KEY BIOM3_WEIGHTS_BUNDLE"

# Secrets are redacted in the SkyPilot dashboard. Declare each name here and pass
# `--secret NAME` at launch, which reads the value from your shell; then add NAME
# to FORWARD_ENV.
# secrets:
#   MY_STORAGE_TOKEN: null

setup: |
  set -euo pipefail
  sudo docker pull "$IMAGE"

# Runs on EVERY node.
run: |
  set -euo pipefail
  HEAD_IP="$(echo "${SKYPILOT_NODE_IPS:-}" | head -n1)"
  OUTPUTS="$HOME/biom3/outputs"
  mkdir -p "$OUTPUTS"
  # sudo resets the environment, so values are passed explicitly, not by name.
  FWD=()
  for v in $FORWARD_ENV; do
    if [ -n "${!v:-}" ]; then FWD+=(-e "$v=${!v}"); fi
  done
  sudo docker run --rm --gpus all --net=host --ipc=host \
    -v "$OUTPUTS:/app/outputs" \
    -e MASTER_ADDR="$HEAD_IP" \
    -e SKYPILOT_NODE_RANK="${SKYPILOT_NODE_RANK:-0}" \
    -e SKYPILOT_NUM_NODES="${SKYPILOT_NUM_NODES:-1}" \
    ${FWD[@]+"${FWD[@]}"} \
    "$IMAGE" bash -lc "$CMD"
